name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release workflow contract
        run: npm run verify:release-workflow

      - name: Install clone-local pm merge drivers
        shell: bash
        run: |
          set -euo pipefail
          # .gitattributes declares pm's field-aware merge drivers, but the
          # drivers themselves live in clone-local git config, which `git
          # clone` never populates. Install them here so the health gate below
          # is a real assertion about a correctly-provisioned clone instead of
          # a guaranteed failure on `--require-merge-drivers`.
          ./node_modules/.bin/pm merge install

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully. `--require-merge-drivers` fails the gate when the
          # clone-local merge driver config declared by .gitattributes is absent.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Type check
        run: npm run typecheck

      - name: Verify complete docstring coverage
        run: npm run docstring

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify every publish invocation is attested
        run: npm run verify:release-publish-attestation

      - name: Verify the changelog date is derived from the version
        run: npm run verify:release-changelog-date

      - name: Verify Bun can install the package graph
        run: bun install --no-save
